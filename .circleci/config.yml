version: 2.1

# TODO: Occasionally we should update these (last checked 2026/06/08)
orbs:
  browser-tools: circleci/browser-tools@2.4.2
  codecov: codecov/codecov@6.0.0

# gen3 resource classes are Linux VM only (they do not exist for the docker
# executor) and are valid only with the `current` image tag. medium.gen3 has
# 8 GiB -- the same memory the docker `large` class gave us -- at 7 credits/min
# rather than 20. Jobs that need more use large.gen3 (16 GiB).
executors:
  linux:
    parameters:
      size:
        type: string
        default: medium.gen3
    machine:
      image: ubuntu-2604:current
    resource_class: << parameters.size >>

# https://circleci.com/docs/workflows/#executing-workflows-for-a-git-tag

commands:
  bash_env:
    steps:
      - run:
          name: Set BASH_ENV
          command: |
            ./.circleci/setup_bash.sh
  gitconfig:
    steps:
      - run:
          name: Set up git config
          command: |
            git config --global user.email "ci-build@mne.tools"
            git config --global user.name "ci-build"

jobs:
  setup_env:
    executor: linux
    steps:
      - run:
          name: Avoid checking out entire repo
          command: |
            CIRCLE_REPOSITORY_URL_HTTPS=$(echo "$CIRCLE_REPOSITORY_URL" | sed --expression="s/git@github.com:/https:\/\/github.com\//g")
            echo "Using: $CIRCLE_REPOSITORY_URL_HTTPS"
            if [ ! -e '/home/circleci/project/.git' ] ; then
              echo 'Cloning git repository'
              mkdir -p '/home/circleci/project'
              cd '/home/circleci/project'
              git clone --single-branch --branch main "$CIRCLE_REPOSITORY_URL_HTTPS" -b main .  # this line is the big change!
              git remote set-url origin "$CIRCLE_REPOSITORY_URL"
            fi
      - checkout
      # Cloned here rather than in setup_bash.sh below so the install script exists
      # before restore_cache needs to hash it into the key
      - run:
          name: Clone mne-tools
          command: |
            git clone --depth 1 https://github.com/mne-tools/mne-tools.git ~/mne-tools
      # Keyed on the install script, so publishing a new bundle invalidates this
      # automatically. Deliberately no prefix fallback: a partial hit would restore a
      # stale tree, and the script skips the download when the directory exists.
      - restore_cache:
          keys:
            - minimal-cmds-{{ checksum "/home/circleci/mne-tools/tools/get_minimal_commands.sh" }}
      # pip's HTTP/wheel cache. The prefix-matching fallback key means a change to
      # pyproject.toml reuses the previous cache rather than starting from scratch.
      - restore_cache:
          keys:
            - pip-cache-0-{{ checksum "pyproject.toml" }}
            - pip-cache-0-
      - bash_env
      - save_cache:
          key: minimal-cmds-{{ checksum "/home/circleci/mne-tools/tools/get_minimal_commands.sh" }}
          paths:
            - ~/minimal_cmds
      - run:
          name: Get Python running
          command: |
            ./.circleci/install_deps.sh
      - save_cache:
          key: pip-cache-0-{{ checksum "pyproject.toml" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Check Qt
          command: |
            bash ~/mne-tools/tools/check_qt_import.sh PySide6
      # Look at what we have and fail early if there is some library conflict
      - run:
          name: Check installation
          command: |
            ./.circleci/check_installation.sh
      - persist_to_workspace:
          root: ~/
          paths:
            - project
            - mne_data
            - minimal_cmds
            - mne-tools
            - python_env

  cache_dataset:
    parameters:
      dataset:
        type: string
      cache_key:
        type: string
      download:
        description: Command replacing the default $DOWNLOAD_DATA
        type: string
        default: ""
    executor: linux
    steps:
      - attach_workspace:
          at: ~/
      - restore_cache:
          keys:
            - << parameters.cache_key >>
      - bash_env
      - when:
          condition:
            equal: ["", << parameters.download >>]
          steps:
            - run:
                name: Get << parameters.dataset >>
                command: $DOWNLOAD_DATA << parameters.dataset >>
      - unless:
          condition:
            equal: ["", << parameters.download >>]
          steps:
            - run:
                name: Get << parameters.dataset >>
                command: << parameters.download >>
      - codecov/upload:
          token: CODECOV_TOKEN
      - save_cache:
          key: << parameters.cache_key >>
          paths:
            - ~/mne_data/<< parameters.dataset >>

  test_dataset:
    parameters:
      test:
        type: string
      cache_key:
        type: string
      size:
        type: string
        default: medium.gen3
      glob:
        description: Reports to persist, relative to deriv_root and sans extension
        type: string
        default: "*/*/*"
      json:
        type: boolean
        default: false
      tsv:
        type: boolean
        default: false
      rerun:
        description: Check that a rerun is fully cached
        type: boolean
        default: true
      copy_files:
        type: boolean
        default: true
      no_output_timeout:
        type: string
        default: 10m
      dask_cluster:
        type: string
        default: ""
      setup:
        type: steps
        default: []
    executor:
      name: linux
      size: << parameters.size >>
    steps:
      - attach_workspace:
          at: ~/
      - bash_env
      - restore_cache:
          keys:
            - << parameters.cache_key >>
      - run:
          name: prepare PyVista settings dir
          command: mkdir -p /home/circleci/.local/share/pyvista
      - steps: << parameters.setup >>
      - run:
          name: test << parameters.test >>
          no_output_timeout: << parameters.no_output_timeout >>
          environment:
            RERUN_TEST: "<< parameters.rerun >>"
            COPY_FILES: "<< parameters.copy_files >>"
            MNE_BIDS_PIPELINE_TEST_DASK_CLUSTER: << parameters.dask_cluster >>
          command: $RUN_TESTS << parameters.test >>
      - codecov/upload:
          token: CODECOV_TOKEN
      - store_test_results:
          path: ./test-results
      - store_artifacts:
          path: ./test-results
          destination: test-results
      - store_artifacts:
          path: /home/circleci/reports
          destination: reports
      # Each job writes a single deriv_root, so * matches only its own
      - when:
          condition: << parameters.copy_files >>
          steps:
            - persist_to_workspace:
                root: ~/
                paths:
                  - mne_data/derivatives/mne-bids-pipeline/*/<< parameters.glob >>.html
      - when:
          condition: << parameters.json >>
          steps:
            - persist_to_workspace:
                root: ~/
                paths:
                  - mne_data/derivatives/mne-bids-pipeline/*/<< parameters.glob >>.json
      - when:
          condition: << parameters.tsv >>
          steps:
            - persist_to_workspace:
                root: ~/
                paths:
                  - mne_data/derivatives/mne-bids-pipeline/*/<< parameters.glob >>.tsv

  build_docs:
    executor: linux
    steps:
      - attach_workspace:
          at: ~/
      - bash_env
      - run:
          name: Install dependencies
          command: |
            pip install -ve . --group docs
      - run:
          name: Build documentation
          command: |
            set -eo pipefail
            ls ~/mne_data/derivatives/mne-bids-pipeline/*/*/*/*.html
            ./docs/build-docs.sh
      - store_artifacts:
          path: docs/site
          destination: site

  deploy_docs:
    executor: linux
    steps:
      - add_ssh_keys:
          fingerprints:
            - "3b:da:0c:a3:e7:e8:31:08:ff:db:c3:42:c9:b5:bf:77"
      - checkout
      - attach_workspace:
          at: ~/
      - bash_env
      - gitconfig
      - run:
          name: Install dependencies
          command: |
            pip install -ve . --group docs
      - run:
          # This is a bit computationally inefficient, but it should be much
          # faster to "cp" directly on the machine rather than persist
          # 1GB doc build to workspace then go retrieve it
          name: Build documentation again
          command: |
            ./docs/build-docs.sh
      - run:
          name: Deploy docs to gh-pages branch
          # https://github.com/jimporter/mike
          command: |
            # Arguments used in all mike commands
            ARGS="--config-file docs/mkdocs.yml"
            # First we need to actually check out our current version of
            # gh-pages so we don't remove it!
            set -x
            git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
            git fetch origin
            # If it's tagged as v*, deploy as "v*" and "stable" as well
            if git describe --tags --exact-match $(git rev-parse HEAD); then
              VERSION="$(git describe --tags --exact-match $(git rev-parse HEAD))"
            else
              VERSION=""
            fi
            if [[ "$VERSION" == "v"* ]]; then
              # Trim v1.0.0 to 1.0
              KIND='stable'
              DEPLOY_VERSION=$(echo $VERSION | sed -nE 's/^v([0-9]+\.[0-9]+).*$$/\1/p')
              echo "Deploying $VERSION as $DEPLOY_VERSION with alias \"stable\""
              mike deploy $DEPLOY_VERSION stable --update-aliases $ARGS
            else
              KIND='dev'
              mike deploy dev $ARGS
            fi
            git checkout gh-pages
            # TODO: On release, consider doing something like:
            # $ rm 1.9/examples/*/sub-*_report.html
            # To save ~500MB-1TB! Left as a manual step for now.
            git reset $(git commit-tree HEAD^{tree} -m "Deploy and squash docs [ci skip]")
            git log -n3  # should just be one, but let's be sure
            git push origin --force gh-pages

workflows:
  version: 2

  test_and_docs:
    jobs:
      - setup_env: &filter_tags
          filters: &filter_tag_tags
            tags:
              only: /^v.*/

      - cache_dataset:
          name: cache_ds000117
          dataset: ds000117
          cache_key: &ds000117 data-cache-ds000117-4
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ds000117
          test: ds000117
          cache_key: *ds000117
          glob: "*/*/*/*"
          requires: [cache_ds000117]
          <<: *filter_tags

      - cache_dataset:
          name: cache_ds003775
          dataset: ds003775
          cache_key: &ds003775 data-cache-ds003775-3
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ds003775
          test: ds003775
          cache_key: *ds003775
          glob: "*/*/*/*"
          requires: [cache_ds003775]
          <<: *filter_tags

      - cache_dataset:
          name: cache_ds001971
          dataset: ds001971
          cache_key: &ds001971 data-cache-ds001971-3
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ds001971
          test: ds001971
          cache_key: *ds001971
          requires: [cache_ds001971]
          <<: *filter_tags

      - cache_dataset:
          name: cache_ds004107
          dataset: ds004107
          cache_key: &ds004107 data-cache-ds004107-3
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ds004107
          test: ds004107
          cache_key: *ds004107
          glob: "*/*/*/*"
          requires: [cache_ds004107]
          <<: *filter_tags

      - cache_dataset:
          name: cache_ds000246
          dataset: ds000246
          cache_key: &ds000246 data-cache-ds000246-4
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ds000246
          test: ds000246
          cache_key: *ds000246
          tsv: true
          no_output_timeout: 15m
          requires: [cache_ds000246]
          <<: *filter_tags

      - cache_dataset:
          name: cache_ds000247
          dataset: ds000247
          cache_key: &ds000247 data-cache-ds000247-4
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ds000247
          test: ds000247
          cache_key: *ds000247
          glob: "*/*/*/*"
          requires: [cache_ds000247]
          <<: *filter_tags

      - cache_dataset:
          name: cache_ds000248
          dataset: ds000248
          cache_key: &ds000248 data-cache-ds000248-7
          # Workaround for https://github.com/OpenNeuroOrg/openneuro/issues/3695
          download: >-
            aws s3 sync --no-sign-request s3://openneuro.org/ds000248 ~/mne_data/ds000248 &&
            rm -Rf ~/mne_data/ds000248/derivatives/freesurfer/subjects/01
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ds000248_base
          test: ds000248_base
          cache_key: *ds000248
          json: true
          tsv: true
          rerun: false  # forces rerunning (cov and FLASH BEM)
          requires: [cache_ds000248]
          <<: *filter_tags
      - test_dataset:
          name: test_ds000248_ica
          test: ds000248_ica
          cache_key: *ds000248
          tsv: true
          requires: [cache_ds000248]
          <<: *filter_tags
      - test_dataset:
          name: test_ds000248_FLASH_BEM
          test: ds000248_FLASH_BEM
          cache_key: *ds000248
          rerun: false
          requires: [cache_ds000248]
          <<: *filter_tags
      - test_dataset:
          name: test_ds000248_T1_BEM
          test: ds000248_T1_BEM
          cache_key: *ds000248
          rerun: false
          no_output_timeout: 20m
          requires: [cache_ds000248]
          <<: *filter_tags
      - test_dataset:
          name: test_ds000248_coreg_surfaces
          test: ds000248_coreg_surfaces
          cache_key: *ds000248
          rerun: false
          copy_files: false
          requires: [cache_ds000248]
          <<: *filter_tags
      - test_dataset:
          name: test_ds000248_no_mri
          test: ds000248_no_mri
          cache_key: *ds000248
          requires: [cache_ds000248]
          <<: *filter_tags

      - cache_dataset:
          name: cache_ds001810
          dataset: ds001810
          cache_key: &ds001810 data-cache-ds001810-3
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ds001810
          test: ds001810
          cache_key: *ds001810
          size: large.gen3
          glob: "*/*/*/*"
          requires: [cache_ds001810]
          <<: *filter_tags

      - cache_dataset:
          name: cache_ds003104
          dataset: ds003104
          cache_key: &ds003104 data-cache-ds003104-4
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ds003104
          test: ds003104
          cache_key: *ds003104
          requires: [cache_ds003104]
          <<: *filter_tags

      - cache_dataset:
          name: cache_ds003392
          dataset: ds003392
          cache_key: &ds003392 data-cache-ds003392-3
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ds003392
          test: ds003392
          cache_key: *ds003392
          json: true
          tsv: true
          requires: [cache_ds003392]
          <<: *filter_tags

      - cache_dataset:
          name: cache_ds004229
          dataset: ds004229
          cache_key: &ds004229 data-cache-ds004229-3
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ds004229
          test: ds004229
          cache_key: *ds004229
          json: true
          tsv: true
          requires: [cache_ds004229]
          <<: *filter_tags

      - cache_dataset:
          name: cache_eeg_matchingpennies
          dataset: eeg_matchingpennies
          cache_key: &eeg_matchingpennies data-cache-eeg_matchingpennies-1
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_eeg_matchingpennies
          test: eeg_matchingpennies
          cache_key: *eeg_matchingpennies
          requires: [cache_eeg_matchingpennies]
          <<: *filter_tags

      - cache_dataset:
          name: cache_MNE-funloc-data
          dataset: MNE-funloc-data
          cache_key: &MNE-funloc-data data-cache-MNE-funloc-data-5
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_MNE-funloc-data
          test: MNE-funloc-data
          cache_key: *MNE-funloc-data
          # ~5 GB per worker and n_jobs=2, so 8 GiB OOM-kills a loky worker
          # during tSSS on the empty-room data
          size: large.gen3
          requires: [cache_MNE-funloc-data]
          <<: *filter_tags

      - cache_dataset:
          name: cache_MNE-phantom-KIT-data
          dataset: MNE-phantom-KIT-data
          cache_key: &MNE-phantom-KIT-data data-cache-MNE-phantom-KIT-data-1
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_MNE-phantom-KIT-data
          test: MNE-phantom-KIT-data
          cache_key: *MNE-phantom-KIT-data
          requires: [cache_MNE-phantom-KIT-data]
          <<: *filter_tags

      - cache_dataset:
          name: cache_ERP_CORE
          dataset: ERP_CORE
          cache_key: &ERP_CORE data-cache-ERP_CORE-1
          requires: [setup_env]
          <<: *filter_tags
      - test_dataset:
          name: test_ERP_CORE_N400
          test: ERP_CORE_N400
          cache_key: *ERP_CORE
          size: large.gen3
          glob: "*/*/*/*"
          setup:
            - browser-tools/install_chrome:
                timeout: 5m
            - run:
                name: Check Chrome installation
                command: google-chrome --version
            - run:
                name: Start single-node SLURM
                command: ./.circleci/setup_slurm.sh
          dask_cluster: slurm
          post-steps:
            - run:
                name: SLURM worker job logs
                command: sinfo && ls -l slurm-*.out && tail -n2 slurm-*.out
                when: always
          requires: [cache_ERP_CORE]
          <<: *filter_tags
      - test_dataset: &ERP_CORE_test
          name: test_ERP_CORE_ERN
          test: ERP_CORE_ERN
          cache_key: *ERP_CORE
          size: large.gen3
          glob: "*/*/*/*"
          requires: [cache_ERP_CORE]
          <<: *filter_tags
      - test_dataset:
          <<: *ERP_CORE_test
          name: test_ERP_CORE_LRP
          test: ERP_CORE_LRP
      - test_dataset:
          <<: *ERP_CORE_test
          name: test_ERP_CORE_MMN
          test: ERP_CORE_MMN
      - test_dataset:
          <<: *ERP_CORE_test
          name: test_ERP_CORE_N2pc
          test: ERP_CORE_N2pc
      - test_dataset:
          <<: *ERP_CORE_test
          name: test_ERP_CORE_N170
          test: ERP_CORE_N170
      - test_dataset:
          <<: *ERP_CORE_test
          name: test_ERP_CORE_P3
          test: ERP_CORE_P3

      - build_docs:
          requires:
            - test_ds000117
            - test_ds003775
            - test_ds001971
            - test_ds004107
            - test_ds000246
            - test_ds000247
            - test_ds000248_base
            - test_ds000248_ica
            - test_ds000248_no_mri
            - test_ds000248_T1_BEM
            - test_ds000248_FLASH_BEM
            - test_ds001810
            - test_ds003104
            - test_ds003392
            - test_ds004229
            - test_eeg_matchingpennies
            - test_MNE-funloc-data
            - test_MNE-phantom-KIT-data
            - test_ERP_CORE_N400
            - test_ERP_CORE_ERN
            - test_ERP_CORE_LRP
            - test_ERP_CORE_MMN
            - test_ERP_CORE_N2pc
            - test_ERP_CORE_N170
            - test_ERP_CORE_P3
          <<: *filter_tags
