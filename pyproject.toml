[project]
name = "mne-bids-pipeline"
# Keep in sync with README.md:
description = "A full-flegded processing pipeline for your MEG and EEG data"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Eric Larson" },
  { name = "Alexandre Gramfort" },
  { name = "Mainak Jas" },
  { name = "Richard Höchenberger", email = "richard.hoechenberger@gmail.com" },
]
keywords = ["neuroscience", "psychology", "science"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
]
dependencies = [
  "annotated-types",
  "autoreject",
  "bokeh",  # for distributed dashboard
  "dask[distributed]",
  "filelock",
  "h5io",
  "joblib >= 1.4.1",  # MemorizedFunc.call returns metadata
  "json_tricks",
  "jupyter-server-proxy",  # to have dask and jupyter working together
  "matplotlib",
  "meegkit",
  "mne-bids[full] >=0.16",
  "mne-icalabel",
  "mne[hdf5] >=1.8",
  "nibabel",
  "numpy",
  "openpyxl",
  "packaging",
  "pandas",
  "psutil",  # for joblib
  "pyarrow",  # from pandas
  "pydantic >= 2.0.0",
  "python-picard",
  "pyvista",
  "pyvistaqt",
  "qtpy",
  "rich",
  "scikit-learn",
  "scipy",
  "seaborn",
  "threadpoolctl",
  "typing_extensions; python_version < '3.12'",  # pydantic needs its TypedDict
]
dynamic = ["version"]

[project.urls]
changelog = "http://mne.tools/mne-bids-pipeline/changes.html"
homepage = "https://mne.tools/mne-bids-pipeline"
repository = "https://github.com/mne-tools/mne-bids-pipeline"

[project.scripts]
mne_bids_pipeline = "mne_bids_pipeline._main:main"

[dependency-groups]
dev = [
  "Pygments",
  "codespell",
  "httpx >= 0.20",
  "jinja2",
  "lefthook",
  "openneuro-py >= 2022.2.0",
  "pooch >= 1.9.0",  # passes filter= to TarFile.extractall
  "psutil",
  "pytest-cov",
  "pytest >= 9.0",
  "pyyaml",
  "ruff",
  "tombi",
  "tqdm",
  "ty>=0.0.12",
]
docs = [
  "black",  # docstring reformatting
  "livereload",
  "mike",
  "mkdocs",
  "mkdocs-exclude",
  "mkdocs-include-markdown-plugin",
  "mkdocs-macros-plugin",
  "mkdocs-material-extensions",
  "mkdocs-material >= 9.0.4",
  "mkdocstrings-python",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.codespell]
skip = "docs/site/*,*.html,steps/freesurfer/contrib/*"
ignore-words = "ignore_words.txt"
builtin = "clear,rare,informal,names,usage"
quiet-level = 3
interactive = 3
enable-colors = ""
count = ""

[tool.coverage.run]
source = ["mne_bids_pipeline"]
# Measure loky/dask workers, too; reports need `coverage combine --append`.
patch = ["subprocess", "_exit"]  # fork/execv raise on Windows
parallel = true
concurrency = ["multiprocessing", "thread"]
sigterm = true  # dask kills workers rather than letting them exit

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "release-branch-semver" }

[tool.hatch.build]
exclude = [
  "/.*",
  "/codecov.yml",
  "**/tests",
  "/docs",
  "/docs/source/examples/gen_examples.py",  # specify explicitly because its exclusion is negated in .gitignore
  "/Makefile",
  "/CONTRIBUTING.md",
  "ignore_words.txt",
]

[tool.pytest.ini_options]
addopts = [
  "--cov=mne_bids_pipeline",
  "--cov-report=xml",
  "--durations=10",
  "--junit-xml=junit-results.xml",
  "--strict-markers",
  "--tb=short",
  "-ra",
  "-vv",
]
junit_family = "xunit2"
markers = [
  "dataset_test: a test that downloads and processes a real BIDS dataset",
]
testpaths = ["mne_bids_pipeline"]

[tool.ruff]
exclude = ["**/freesurfer/contrib", "dist/", "build/", "**/.*cache"]

[tool.ruff.lint]
select = ["A", "B006", "D", "E", "F", "I", "W", "UP", "TID252"]
ignore = [
  "D104",  # Missing docstring in public package
]

[tool.ruff.lint.per-file-ignores]
"mne_bids_pipeline/typing.py" = ["A005"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
